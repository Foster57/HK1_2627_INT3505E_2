openapi: 3.0.3
info:
  title: Pet Store API Specification
  description: >-
    Đặc tả API Quản lý Cửa hàng Thú cưng (Petstore API) tuân thủ chuẩn OpenAPI 3.0.3.
    Hệ thống chuẩn hóa phản hồi lỗi theo đặc tả RFC 7807 (Problem Details for HTTP APIs).
  version: 1.0.0
  contact:
    name: Backend Engineering Team
    email: dev@example.com

servers:
  - url: http://localhost:8080/v1
    description: Máy chủ kiểm thử cục bộ (Local Development Server)
  - url: https://api.petstore.example.com/v1
    description: Máy chủ môi trường Production

tags:
  - name: pets
    description: Các thao tác CRUD đối với thực thể Thú cưng

paths:
  /pets:
    get:
      tags:
        - pets
      summary: Lấy danh sách thú cưng
      description: Trả về danh sách thú cưng có phân trang và tùy chọn lọc theo danh mục / thẻ tag.
      operationId: listPets
      parameters:
        - name: limit
          in: query
          description: Số lượng bản ghi tối đa trả về trong một lần truy vấn (tối đa 100)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: tag
          in: query
          description: Lọc thú cưng theo thẻ định danh (tag)
          required: false
          schema:
            type: string
            example: dog
      responses:
        '200':
          description: Truy vấn danh sách thú cưng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pets'
        '400':
          description: Tham số yêu cầu không hợp lệ (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Sự cố nội bộ từ phía máy chủ (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - pets
      summary: Tạo mới thú cưng
      description: Đăng ký thông tin một thú cưng mới vào cơ sở dữ liệu.
      operationId: createPet
      requestBody:
        description: Thông tin chi tiết của thú cưng cần tạo mới
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Tạo thú cưng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Dữ liệu gửi lên không đúng định dạng hoặc thiếu trường bắt buộc
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi hệ thống trong quá trình lưu trữ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /pets/{petId}:
    get:
      tags:
        - pets
      summary: Xem chi tiết thú cưng theo ID
      description: Trả về đầy đủ thông tin của một thú cưng dựa trên ID được cung cấp.
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          description: Mã định danh ID của thú cưng
          required: true
          schema:
            type: integer
            format: int64
            example: 101
      responses:
        '200':
          description: Tìm thấy thú cưng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Định dạng petId không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy thú cưng với petId tương ứng
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - pets
      summary: Xóa thú cưng khỏi hệ thống
      description: Xóa vĩnh viễn thông tin thú cưng dựa trên petId.
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          description: Mã ID của thú cưng cần xóa
          required: true
          schema:
            type: integer
            format: int64
            example: 101
      responses:
        '204':
          description: Xóa thú cưng thành công (No Content)
        '404':
          description: Không tìm thấy thú cưng để xóa
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi máy chủ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Tên thú cưng
          example: Golden Retriever
        tag:
          type: string
          description: Thẻ phân loại hoặc nhóm
          example: dog
        status:
          type: string
          description: Tình trạng (available, pending, sold)
          enum:
            - available
            - pending
            - sold
          default: available

    Pet:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              description: Khóa chính tự sinh
              example: 1
        - $ref: '#/components/schemas/NewPet'

    Pets:
      type: array
      description: Mảng danh sách các thú cưng
      items:
        $ref: '#/components/schemas/Pet'

    Error:
      type: object
      description: Cấu trúc chi tiết lỗi theo đặc tả RFC 7807 (Problem Details)
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI định danh phân loại sự cố
          example: https://httpstatuses.com/404
        title:
          type: string
          description: Tóm tắt ngắn gọn loại lỗi
          example: Pet Not Found
        status:
          type: integer
          description: Mã HTTP Status
          example: 404
        detail:
          type: string
          description: Lời giải thích dễ hiểu về nguyên nhân cụ thể của sự cố
          example: Thú cưng có mã ID 101 không tồn tại trong hệ thống.
        instance:
          type: string
          description: URI request đã gây ra lỗi
          example: /v1/pets/101
        trace_id:
          type: string
          description: Mã theo dõi log request
          example: d290f1ee-6c54-4b01-90e6-d701748f0851