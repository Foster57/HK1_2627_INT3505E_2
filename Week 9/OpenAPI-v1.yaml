openapi: 3.0.0
info:
  title: User API
  version: "1.0.0"
  description: API v1 (deprecated) – sẽ bị loại bỏ trong tương lai.

paths:
  /api/v1/users/{id}:
    get:
      summary: Get user (v1)
      deprecated: true
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV1"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: User not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: nf

  schemas:
    UserV1:
      type: object
      properties:
        id: { type: integer, example: 1 }
        full_name: { type: string, example: "Văn Nguyễn" }
        email: { type: string, example: "a@vnu.vn" }
