[project]
name = "product-api"
version = "0.1.0"
description = "Production-ready Product & Order REST API built with Flask and flask-smorest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "flask-smorest>=0.42.0",
    "marshmallow>=3.20.0",
    "SQLAlchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "apispec>=6.3.0",
    "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

